name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed by the "Release" step below. `write` is the repository default,
      # but stating it explicitly means adding another scope here later (e.g.
      # `id-token: write` for trusted publishing) cannot silently drop
      # `contents` to `none`.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: "Install AWK"
        run: sudo apt-get update && sudo apt-get -y install gawk && awk --version
      - name: Extract first Changelog entry
        run: cat CHANGELOG.md | awk '/^##/{block++} {if (block==1) {print}}' > CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.txt
          draft: false
          name: ${{ github.ref_name }}
        env:
          GITHUB_REPOSITORY: fastly/fastly-go
      - name: Force quicker pkg.go.dev indexing
        run: curl 'https://proxy.golang.org/github.com/fastly/fastly-go/@v/${{ github.ref_name }}.info'
